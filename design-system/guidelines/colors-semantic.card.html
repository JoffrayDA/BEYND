</style></head>
<body>
<div class="row">
  <div class="sw" style="background:var(--color-danger)">danger</div>
  <div class="sw" style="background:var(--color-warning);color:var(--color-text)">warning</div>
  <div class="sw" style="background:var(--color-success)">success</div>
</div>
</body></html>
