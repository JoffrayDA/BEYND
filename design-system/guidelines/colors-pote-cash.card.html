<html><head><link rel="stylesheet" href="../styles.css"><style>
body{font-family:var(--font-sans);padding:16px;background:var(--color-bg)}
.row{display:flex;gap:10px}
.sw{flex:1;height:64px;border-radius:var(--radius-sm);display:flex;align-items:flex-end;padding:8px;font-size:11px;color:#fff;font-weight:600}
.card{background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-md);padding:14px;box-shadow:var(--shadow-sm)}
</style></head>
<body data-theme="pote-cash">
<div class="card">
<div class="row">
  <div class="sw" style="background:var(--color-primary)">primary</div>
  <div class="sw" style="background:var(--color-accent)">accent</div>
  <div class="sw" style="background:var(--color-accent-2)">accent-2</div>
  <div class="sw" style="background:var(--color-bg-subtle);color:var(--color-text)">bg-subtle</div>
  <div class="sw" style="background:var(--color-border-strong)">text</div>
</div>
</div>
</body></html>
