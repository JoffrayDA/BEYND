<!-- @dsCard group="Spacing" viewport="700x180" name="Radius Scale" subtitle="Soft-modern corners, not pill-everything" -->
<html><head><link rel="stylesheet" href="../styles.css"><style>
body{padding:16px;background:var(--color-bg);font-family:var(--font-sans);display:flex;gap:14px}
.box{width:100px;height:100px;background:var(--color-surface);border:1px solid var(--color-border);display:flex;align-items:flex-end;justify-content:center;font-size:11px;color:var(--color-text-muted);padding-bottom:6px}
</style></head>
<body>
<div class="box" style="border-radius:var(--radius-sm)">sm 8</div>
<div class="box" style="border-radius:var(--radius-md)">md 14</div>
<div class="box" style="border-radius:var(--radius-lg)">lg 20</div>
<div class="box" style="border-radius:var(--radius-xl)">xl 28</div>
<div class="box" style="border-radius:var(--radius-pill);width:60px">pill</div>
</body></html>
